# Dependabot Configuration for Automated Dependency Updates
# LOW-004: Security fix for automated dependency monitoring
#
# This configuration enables Dependabot to automatically check for and create
# pull requests for dependency updates in the package and CI workflows.

version: 2
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

# Security Updates:
# - Dependabot will automatically create PRs for security updates regardless of schedule
# - Security updates are prioritized and opened immediately when detected
# - Critical vulnerabilities will open PRs even if open-pull-requests-limit is reached
#
# To customize for your team:
# 1. Adjust schedule timing to match your team's workflow
# 2. Add assignees if you want automatic PR assignments
# 3. Configure ignore rules if specific packages should not be updated
#
# Example ignore configuration (add to any update block):
# ignore:
#   - dependency-name: "package-name"
#     versions: ["1.x", "2.x"]
#   - dependency-name: "another-package"
#     update-types: ["version-update:semver-major"]
